<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prismatic Truth — Max Folio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#050508;color:#c8c8e0;font-family:'Segoe UI',sans-serif;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow:hidden}
h1{color:#e8c840;font-size:1.5em;margin:10px 0;text-align:center;position:absolute;z-index:10;text-shadow:0 0 20px rgba(0,0,0,0.8)}
canvas{position:fixed;top:0;left:0;width:100vw;height:100vh}
.controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:10px}
button{background:rgba(20,20,40,0.8);color:#e8c840;border:1px solid #444;border-radius:6px;padding:8px 16px;cursor:pointer;backdrop-filter:blur(10px)}
button:hover{background:rgba(40,40,70,0.8)}
.info{position:fixed;top:15px;right:20px;z-index:10;color:#888;font-size:0.85em;backdrop-filter:blur(10px);background:rgba(10,10,20,0.6);padding:8px 12px;border-radius:8px}
</style>
</head>
<body>
<h1>Prismatic Truth</h1>
<div class="info">Move mouse to shift the prism. Click to refract.</div>
<canvas id="canvas"></canvas>
<div class="controls">
<button id="new">New Prism</button>
<button id="speed">Toggle Motion</button>
<button id="density">More Beams</button>
</div>
<script>
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
let W,H,beams=[],prism={x:0,y:0},mouseX=0,mouseY=0,beamCount=12,autoMotion=true,particles=[];

function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
  prism={x:W/2,y:H/2};
}

function freqToColor(f,c,alpha){
  if(alpha===undefined)alpha=1;
  const r=Math.round(255*(1-f)*c);
  const g=Math.round(255*f*c);
  const b=Math.round(120*(1-Math.abs(f-0.5)*2)*c);
  return 'rgba('+r+','+g+','+b+','+alpha+')';
}

function initBeams(){
  beams=[];
  for(let i=0;i<beamCount;i++){
    const f=i/(beamCount-1);
    beams.push({f:f,c:0.3+Math.random()*0.7,offsetPhase:Math.random()*Math.PI*2,speed:0.5+Math.random()*1.5,length:250+Math.random()*400});
  }
}

function initParticles(){
  particles=[];
  for(let i=0;i<60;i++){
    particles.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-0.5)*0.5,vy:(Math.random()-0.5)*0.5,size:1+Math.random()*3,f:Math.random(),c:0.3+Math.random()*0.5,phase:Math.random()*Math.PI*2});
  }
}

function draw(time){
  ctx.fillStyle='rgba(5,5,8,0.06)';
  ctx.fillRect(0,0,W,H);

  if(autoMotion){
    prism.x=W/2+Math.sin(time*0.0003)*W*0.15;
    prism.y=H/2+Math.cos(time*0.0002)*H*0.1;
  }else{
    prism.x=mouseX||W/2;
    prism.y=mouseY||H/2;
  }

  // Incoming white beam
  ctx.shadowBlur=30;
  ctx.shadowColor='rgba(255,255,255,0.8)';
  ctx.strokeStyle='rgba(255,255,255,0.6)';
  ctx.lineWidth=3;
  ctx.beginPath();
  ctx.moveTo(0,prism.y);
  ctx.lineTo(prism.x-30,prism.y);
  ctx.stroke();
  ctx.shadowBlur=0;

  // Prism triangle
  ctx.fillStyle='rgba(200,200,255,0.08)';
  ctx.strokeStyle='rgba(200,200,255,0.3)';
  ctx.lineWidth=1;
  ctx.beginPath();
  ctx.moveTo(prism.x-30,prism.y-50);
  ctx.lineTo(prism.x+30,prism.y);
  ctx.lineTo(prism.x-30,prism.y+50);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();

  // Spectrum beams
  for(let i=0;i<beams.length;i++){
    const b=beams[i];
    const spreadAngle=(b.f-0.5)*1.2;
    const dynamicAngle=autoMotion?Math.sin(time*0.001*b.speed+b.offsetPhase)*0.2:0;
    const angle=spreadAngle+dynamicAngle;
    const startX=prism.x+30;
    const startY=prism.y;
    const endX=startX+Math.cos(angle)*b.length;
    const endY=startY+Math.sin(angle)*b.length;
    const color=freqToColor(b.f,b.c,0.8);
    const colorFade=freqToColor(b.f,b.c,0);
    const grad=ctx.createLinearGradient(startX,startY,endX,endY);
    grad.addColorStop(0,color);
    grad.addColorStop(1,colorFade);
    ctx.shadowBlur=15;
    ctx.shadowColor=color;
    ctx.strokeStyle=grad;
    ctx.lineWidth=4;
    ctx.beginPath();
    ctx.moveTo(startX,startY);
    ctx.lineTo(endX,endY);
    ctx.stroke();
  }
  ctx.shadowBlur=0;

  // Floating belief particles
  for(const p of particles){
    p.x+=p.vx;
    p.y+=p.vy;
    p.phase+=0.02;
    if(p.x<0||p.x>W)p.vx*=-1;
    if(p.y<0||p.y>H)p.vy*=-1;
    const pulseC=p.c*(0.7+0.3*Math.sin(p.phase));
    const color=freqToColor(p.f,pulseC,0.6);
    ctx.shadowBlur=8;
    ctx.shadowColor=color;
    ctx.fillStyle=color;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
    ctx.fill();
  }
  ctx.shadowBlur=0;

  requestAnimationFrame(draw);
}

window.addEventListener('resize',resize);
canvas.addEventListener('mousemove',e=>{mouseX=e.clientX;mouseY=e.clientY});
canvas.addEventListener('click',()=>{initBeams();initParticles()});

document.getElementById('new').onclick=()=>{initBeams();initParticles()};
document.getElementById('speed').onclick=()=>{autoMotion=!autoMotion};
document.getElementById('density').onclick=()=>{beamCount=Math.min(24,beamCount+4);initBeams()};

resize();
initBeams();
initParticles();
requestAnimationFrame(draw);
</script>
</body>
</html>
