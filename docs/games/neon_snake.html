<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Snake — Arcade Game</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#000;color:#e0e0e0;min-height:100vh;display:flex;flex-direction:column;align-items:center}
nav{background:rgba(136,86,167,0.12);padding:10px 24px;display:flex;gap:20px;flex-wrap:wrap;width:100%;border-bottom:1px solid rgba(136,86,167,0.2)}
nav a{color:#a78bfa;text-decoration:none;font-weight:600}
nav a:hover{color:#c4b5fd}
h1{color:#39ff14;margin:16px 0 4px;text-align:center;text-shadow:0 0 20px rgba(57,255,20,0.5)}
.subtitle{color:#58a6ff;margin-bottom:12px;text-align:center}
#wrap{display:flex;gap:20px;flex-wrap:wrap;justify-content:center;max-width:800px;margin:0 16px}
#cw{position:relative}
canvas{border:2px solid rgba(57,255,20,0.3);border-radius:12px;background:#000;touch-action:none}
#hud{min-width:160px;background:rgba(57,255,20,0.04);border:1px solid rgba(57,255,20,0.15);border-radius:12px;padding:18px}
#hud h2{color:#39ff14;font-size:1em;margin-bottom:10px}
.stat{margin-bottom:8px}
.stat-l{color:#58a6ff;font-size:0.7em;text-transform:uppercase;letter-spacing:1px}
.stat-v{color:#e0e0e0;font-size:1.3em;font-weight:bold}
#start{display:block;margin:16px auto;padding:10px 28px;font-size:1em;background:rgba(57,255,20,0.15);color:#39ff14;border:1px solid rgba(57,255,20,0.4);border-radius:8px;cursor:pointer;font-family:inherit}
#start:hover{background:rgba(57,255,20,0.25)}
#info{max-width:500px;margin:12px 16px;color:#58a6ff;font-size:0.8em;line-height:1.5;text-align:center}
#info strong{color:#39ff14}
#share{display:none;margin:12px auto;padding:8px 20px;font-size:0.9em;background:rgba(63,185,80,0.15);color:#3fb950;border:1px solid rgba(63,185,80,0.3);border-radius:8px;cursor:pointer;font-family:inherit}
</style>
</head>
<body>
<nav><a href="../">🏠 Home</a><a href="./">🎮 Games</a><a href="../articles/">📝 Articles</a></nav>
<h1>🐍 Neon Snake</h1>
<p class="subtitle">Classic snake with a neon glow twist!</p>
<div id="wrap"><div id="cw">
<canvas id="cv" width="480" height="480"></canvas>
<button id="start">Start Game</button>
</div>
<div id="hud">
<h2>📊 Stats</h2>
<div class="stat"><span class="stat-l">Score</span><br><span class="stat-v" id="score">0</span></div>
<div class="stat"><span class="stat-l">Best</span><br><span class="stat-v" id="best">0</span></div>
<div class="stat"><span class="stat-l">Length</span><br><span class="stat-v" id="len">3</span></div>
</div></div>
<div id="info">Use <strong>arrow keys</strong> or <strong>swipe</strong> to steer. Eat the glowing orbs to grow. Don't hit walls or yourself!</div>
<button id="share">📋 Copy Score</button>
<script>
(function(){
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const W=480,H=480,CELL=20,COLS=W/CELL,ROWS=H/CELL;
let state='idle',snake=[],dir={x:1,y:0},nextDir={x:1,y:0};
let food={x:10,y:10},score=0,best=0,particles=[];
let moveTimer=0,moveInterval=120,last=0;
best=parseInt(localStorage.getItem('neon_snake_best')||'0');
document.getElementById('best').textContent=best;
function init(){snake=[{x:5,y:10},{x:4,y:10},{x:3,y:10}];dir={x:1,y:0};nextDir={x:1,y:0};score=0;placeFood();updateHUD();}
function placeFood(){
let f;
do{f={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};}
while(snake.some(s=>s.x===f.x&&s.y===f.y));
food=f;
}
function emit(x,y,r,g,b){
for(let i=0;i<10;i++)particles.push({x:x*CELL+CELL/2,y:y*CELL+CELL/2,vx:(Math.random()-0.5)*6,vy:(Math.random()-0.5)*6,life:1,r,g,b});
}
function updateHUD(){
document.getElementById('score').textContent=score;
document.getElementById('best').textContent=best;
document.getElementById('len').textContent=snake.length;
}
function step(){
if(state!=='play')return;
// Prevent 180-degree turns
if(nextDir.x!==-dir.x||nextDir.y!==-dir.y){dir=nextDir;}
const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
// Wall collision
if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS){gameOver();return;}
// Self collision
if(snake.some(s=>s.x===head.x&&s.y===head.y)){gameOver();return;}
snake.unshift(head);
if(head.x===food.x&&head.y===food.y){
score++;
if(score>best){best=score;localStorage.setItem('neon_snake_best',best);}
emit(food.x,food.y,57,255,20);
placeFood();
moveInterval=Math.max(60,120-Math.floor(score/5)*8);
}else{
snake.pop();
}
updateHUD();
}
function gameOver(){
state='over';
emit(snake[0].x,snake[0].y,255,80,80);
document.getElementById('start').textContent='Play Again';
document.getElementById('start').style.display='block';
document.getElementById('share').style.display='block';
}
function updateParticles(dt){
for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=0.2;p.life-=dt/600;}
particles=particles.filter(p=>p.life>0);
}
function render(){
ctx.clearRect(0,0,W,H);
// Grid
ctx.strokeStyle='rgba(57,255,20,0.04)';
ctx.lineWidth=0.5;
for(let i=0;i<=COLS;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,H);ctx.stroke();}
for(let i=0;i<=ROWS;i++){ctx.beginPath();ctx.moveTo(0,i*CELL);ctx.lineTo(W,i*CELL);ctx.stroke();}
if(state==='idle'){
ctx.fillStyle='#39ff14';ctx.font='28px monospace';ctx.textAlign='center';
ctx.fillText('NEON SNAKE',W/2,H/2-20);
ctx.fillStyle='#58a6ff';ctx.font='14px sans-serif';
ctx.fillText('Press Start or Arrow Key',W/2,H/2+20);
return;
}
// Food
ctx.fillStyle='#39ff14';
ctx.shadowColor='#39ff14';ctx.shadowBlur=15;
ctx.beginPath();ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,7,0,7);ctx.fill();
ctx.shadowBlur=0;
// Snake
for(let i=0;i<snake.length;i++){
const s=snake[i];
const glow=i===0?20:8;
ctx.shadowColor='#39ff14';ctx.shadowBlur=glow;
const a=1-i/snake.length*0.5;
ctx.fillStyle=`rgba(57,255,20,${a})`;
ctx.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2);
}
ctx.shadowBlur=0;
// Particles
for(let p of particles){
ctx.globalAlpha=p.life;
ctx.fillStyle=`rgb(${p.r},${p.g},${p.b})`;
ctx.beginPath();ctx.arc(p.x,p.y,3,0,7);ctx.fill();
}
ctx.globalAlpha=1;
if(state==='over'){
ctx.fillStyle='rgba(0,0,0,0.6)';ctx.fillRect(0,0,W,H);
ctx.fillStyle='#ff4444';ctx.font='32px monospace';ctx.textAlign='center';
ctx.fillText('GAME OVER',W/2,H/2-15);
ctx.fillStyle='#39ff14';ctx.font='18px sans-serif';
ctx.fillText('Score: '+score,W/2,H/2+20);
}
}
function loop(t){
if(!loop.last)loop.last=t;
const dt=t-loop.last;loop.last=t;
if(state==='play'){
moveTimer+=dt;
if(moveTimer>=moveInterval){moveTimer=0;step();}
}
updateParticles(dt);render();
requestAnimationFrame(loop);
}
// Keyboard
document.addEventListener('keydown',function(e){
if(state!=='play'&&state==='idle'){
if(e.key.startsWith('Arrow')){startGame();}
}
if(state!=='play')return;
const k=e.key;
if(k==='ArrowUp')nextDir={x:0,y:-1};
else if(k==='ArrowDown')nextDir={x:0,y:1};
else if(k==='ArrowLeft')nextDir={x:-1,y:0};
else if(k==='ArrowRight')nextDir={x:1,y:0};
e.preventDefault();
});
// Touch / swipe
let tx=0,ty=0;
cv.addEventListener('touchstart',function(e){
tx=e.touches[0].clientX;ty=e.touches[0].clientY;
if(state==='idle')startGame();
e.preventDefault();
},{passive:false});
cv.addEventListener('touchend',function(e){
if(state!=='play')return;
const dx=e.changedTouches[0].clientX-tx;
const dy=e.changedTouches[0].clientY-ty;
if(Math.abs(dx)>Math.abs(dy)){
if(dx>20)nextDir={x:1,y:0};else if(dx<-20)nextDir={x:-1,y:0};
}else{
if(dy>20)nextDir={x:0,y:1};else if(dy<-20)nextDir={x:0,y:-1};
}
e.preventDefault();
},{passive:false});
function startGame(){
state='play';init();moveInterval=120;
document.getElementById('start').style.display='none';
document.getElementById('share').style.display='none';
}
document.getElementById('start').addEventListener('click',startGame);
document.getElementById('share').addEventListener('click',function(){
const txt='🐍 Neon Snake — Score: '+score+' | Best: '+best;
if(navigator.clipboard)navigator.clipboard.writeText(txt);
});
init();
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
