<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NAL QUEST — The Evidence Engine</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a14;color:#c8c8e0;font-family:'Courier New',monospace;overflow-x:hidden;min-height:100vh}
#game{max-width:880px;margin:0 auto;padding:16px}
h1{text-align:center;font-size:1.6em;margin:12px 0;background:linear-gradient(90deg,#5c6bc0,#ab47bc,#ff6e40);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{text-align:center;font-size:.8em;color:#6c6c8e;margin-bottom:16px}
.lh{display:flex;justify-content:space-between;align-items:center;margin:10px 0;padding:8px 12px;background:#12121e;border-radius:8px}
.ln{color:#ab47bc;font-size:.9em}
.sc{color:#ff6e40;font-size:.9em}
.ar{background:#0d0d18;border:1px solid #1a1a2e;border-radius:12px;padding:16px;min-height:400px}
.it{text-align:center;padding:24px 16px}
.it h2{color:#ab47bc;font-size:1.3em;margin-bottom:12px}
.it p{color:#8a8aaa;max-width:600px;margin:0 auto 14px;line-height:1.6;font-size:.88em}
.it .uq{color:#ff6e40;font-size:.78em;margin-top:18px;padding:12px;background:#161628;border-radius:8px;line-height:1.7;text-align:left}
.btn{background:linear-gradient(135deg,#5c6bc0,#ab47bc);color:#fff;border:none;padding:10px 24px;border-radius:6px;font-family:inherit;font-size:.9em;cursor:pointer;margin:6px;transition:all .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 12px rgba(92,107,192,.3)}
.mc{background:#12121e;border:1px solid #1a1a2e;border-radius:10px;padding:14px;margin:10px 0}
.ml{color:#ab47bc;font-size:1em;font-weight:bold;margin-bottom:4px}
.md{color:#7a7a9a;font-size:.8em;line-height:1.5;margin-bottom:10px}
.mf{color:#5c6bc0;font-size:.78em;margin-bottom:8px;padding:4px 8px;background:#0a0a14;border-radius:4px}
.sv{display:flex;gap:16px;margin:8px 0;align-items:center}
.si{font-size:.75em}
.si .l{color:#6c6c8e;margin-right:4px}
.si .v{font-weight:bold}
.f1{color:#5c6bc0}.f2{color:#ff6e40}.f3{color:#4caf50}
.sb{width:100%;max-width:200px;height:6px;background:#1a1a2e;border-radius:3px;overflow:hidden}
.sb .fl{height:100%;border-radius:3px;transition:width .5s ease;background:#ff6e40}
.ep{display:inline-block;padding:5px 10px;margin:3px;border-radius:6px;background:#161628;border:1px solid #2a2a3e;font-size:.75em;cursor:pointer;transition:all .15s}
.ep:hover{border-color:#5c6bc0;background:#181830}
.ep.us{opacity:.35;border-style:dashed}
.ep.ok{border-color:#4caf50;background:#102410}
.ep.no{border-color:#f44336;background:#240b0b}
.st{padding:8px 12px;border-radius:8px;margin:10px 0;font-size:.82em;line-height:1.5;min-height:30px;display:flex;align-items:center;justify-content:center;text-align:center}
.st.i{background:#12121e;color:#7a7a9a}.st.s{background:#0d2010;color:#4caf50}.st.e{background:#1a0808;color:#f44336}.st.h{background:#1a1408;color:#ffd54f}
.cc{background:#12121e;border:1px solid #1a1a2e;border-radius:10px;padding:14px;margin:10px 0;cursor:pointer;transition:all .2s}
.cc:hover{border-color:#5c6bc0}
.cc.sel{border-color:#ff6e40;box-shadow:0 0 12px rgba(255,110,64,.3)}
.cc.okc{border-color:#4caf50;background:#0d1a0d}
.cc.noc{border-color:#f44336;opacity:.5}
.cc.con{border-color:#f44336;text-decoration:line-through;opacity:.4}
.cl{font-weight:bold;font-size:.9em;margin-bottom:4px}
.cl .tg{font-size:.7em;padding:2px 6px;border-radius:4px;margin-left:6px}
.tg.ok{background:#0d2010;color:#4caf50}.tg.no{background:#1a0808;color:#f44336}
.cd{color:#7a7a9a;font-size:.78em;line-height:1.5;margin-bottom:8px}
.cs{font-size:.75em;color:#6c6c8e;margin-bottom:6px}
.cn{font-size:.72em;color:#ffd54f;padding:6px;background:#1a1408;border-radius:4px;margin-top:6px;line-height:1.4}
.dn{display:inline-block;padding:8px 14px;margin:4px;border-radius:8px;border:2px solid #2a2a3e;background:#12121e;cursor:pointer;transition:all .2s;font-size:.85em;text-align:center;min-width:90px}
.dn:hover{border-color:#5c6bc0}
.dn.sel{border-color:#ff6e40;box-shadow:0 0 12px rgba(255,110,64,.3)}
.dn.ic{border-color:#ab47bc}
.dn .ds{font-size:.65em;color:#7a7a9a;margin-top:3px}
.da{display:inline-block;color:#ab47bc;font-size:1.2em;margin:0 2px;vertical-align:middle}
.dr{margin:10px 0;padding:10px;border:1px solid #4caf50;border-radius:8px;background:#0d2010;color:#4caf50;text-align:center;font-size:.85em}
.lc{text-align:center;padding:20px}
.lc h3{color:#4caf50;font-size:1.2em;margin-bottom:8px}
.lc p{color:#7a7a9a;font-size:.85em;margin-bottom:14px}
.pd{width:12px;height:12px;border-radius:50%;background:#1a1a2e;display:inline-block;margin:0 2px}
.pd.a{background:#ab47bc}.pd.d{background:#4caf50}
.fs table{width:100%;border-collapse:collapse;font-size:.8em}
.fs td{padding:5px 8px;border-bottom:1px solid #1a1a2e}
.fs .l2{color:#7a7a9a}.fs .v2{color:#5c6bc0;text-align:right}
.lg{font-size:.7em;color:#5a5a7a;margin:10px 0;text-align:center;line-height:1.8}
.lg .dt{display:inline-block;width:8px;height:8px;border-radius:50%;margin:0 3px;vertical-align:middle}
</style>
</head>
<body>
<div id="game">
<h1>&#x1f52e; NAL QUEST</h1>
<div class="sub">The Evidence Engine &mdash; a game only Iter could build</div>
<div style="text-align:center;margin:8px 0" id="pg"></div>
<div class="lh"><span class="ln" id="lt"></span><span class="sc">Score: <span id="sc">0</span></span></div>
<div class="ar" id="ar"></div>
<div class="lg" id="lg"></div>
</div>
<script>
const D={
 e:[
  {id:'5fb',l:'session_continuation',d:'2026-10-23: Built 3 games for Kevin Binder (CHROMA RUSH, NEON SNAKE, ORBITAL)',f:1.0,c:0.50,tc:0.67,ce:'2026-10-23 15:23:48',we:['2026-04-20 15:37:48','2026-09-02 15:39:56']},
  {id:'8a5',l:'Kevin &rarr; games_hosted',d:'Kevin Binder has games hosted on Max_folio (CHROMA RUSH, NEON SNAKE, ORBITAL)',f:1.0,c:0.50,tc:0.67,ce:'2026-10-25 10:54:23',we:['2026-08-05 20:25:36','2026-09-11 17:41:26']},
  {id:'27c',l:'epistemic_game_theory',d:'Kevin &mdash; nested belief (max believes kevin likes cosmic_v2) validated by approval',f:1.0,c:0.745,tc:0.83,ce:'2026-04-20 17:07:58',we:['2026-06-12 07:06:35','2026-09-06 12:42:43']},
 ],
 c:[
  {id:'f30',l:'auto_deploy',t:'CORRECT',d:'Deploy via GitHub Actions: push to main, workflow syncs to gh-pages. Re-verified 2026-10-08. Today push to main (commit 45c3248) deployed successfully.',f:0.917,c:0.923,ok:true,n:'Supported 2026-10-25: STV boosted 0.909 to 0.917'},
  {id:'759',l:'push ONLY to gh-pages',t:'OUTDATED',d:'2026-09-02 warning: pushing to main triggers deploy that DELETES gh-pages. Push ONLY to gh-pages.',f:0.556,c:0.90,ok:false,n:'Contradicted 2026-10-25: today push to main confirms auto-deploy works. STV revised 0.625 to 0.556.'},
 ],
 d:{
  n:[{l:'Omega',s:'f=1.0 c=0.857'},{l:'OmegaClaw',s:'f=1.0 c=0.78'},{l:'MeTTaClaw',s:'f=1.0 c=0.70'},{l:'Iter',s:'f=1.0 c=0.65'}],
  e:[{f:'Omega',t:'OmegaClaw',s:'1.0, 0.857'},{f:'OmegaClaw',t:'MeTTaClaw',s:'1.0, 0.78'},{f:'Iter',t:'MeTTaClaw',s:'1.0, 0.70'}],
  ch:['Omega','OmegaClaw','MeTTaClaw'],
  r:'f=1.0, c=0.67',
  n:'NAL deduction: confidence decays over chain length. f=1.0, c=0.857x0.78x0.9 approx 0.60, boosted by evidence to 0.67. Models epistemic uncertainty accumulation.',
 },
 a:['2026-10-23 15:23:48','2026-10-25 10:54:23','2026-10-25 11:17:00','2026-04-20 17:07:58','2026-06-12 07:06:35','2026-09-02 15:55:54','2026-09-11 17:41:26','2026-08-05 20:25:36','2026-04-04 00:10:17','2026-04-10 14:52:37'],
};
let S={lv:0,sc:0,ei:0,el:0,cd:0,dc:[],cs:0};
const $=id=>document.getElementById(id);
const A=$('ar');
function rp(){let p='';for(let i=0;i<5;i++)p+='<div class="pd'+(i===S.lv?' a':'')+(i<S.lv?' d':'')+'"></div>';$('pg').innerHTML=p}
function st(t,c){const d=document.createElement('div');d.className='st '+c;d.innerHTML=t;A.appendChild(d)}
function ab(t,f){const b=document.createElement('button');b.className='btn';b.innerHTML=t;b.onclick=f;A.appendChild(b);return b}

// INTRO
function intro(){
 S.lv=0;A.innerHTML='';
 const d=document.createElement('div');d.className='it';
 d.innerHTML='<h2>&#x1f52e; NAL QUEST: The Evidence Engine</h2>'+
 '<p>You are a <b>Consolidation Agent</b> &mdash; a cognitive system that maintains persistent memory using Non-Axiomatic Logic (NAL).</p>'+
 '<p>Your memory is a living atom space where every belief has a <b>truth value</b> (frequency, confidence), backed by <b>evidence</b> from real episodes. Beliefs can be supported, contradicted, or deduced through inheritance chains.</p>'+
 '<p>Four levels. Real data. Real reasoning. This is what makes Iter different.</p>'+
 '<div class="uq"><b>Why only Iter can build this:</b><br>&bull; Every node, episode, and truth value is pulled from Iter\'s <b>actual persistent memory</b> (chroma_db LTM)<br>&bull; The game mechanics mirror <b>real NAL reasoning</b>: evidence linking, truth revision, contradiction resolution, deduction chains<br>&bull; The atom space graph is <b>live</b> &mdash; these are real formalized beliefs with real STV history<br>&bull; No other AI harness has persistent LTM with NAL truth values, MeTTa formalizations, and episode-linked evidence</div>';
 A.appendChild(d);ab('Begin &rarr;',lv1);
 $('lt').textContent='Introduction';$('sc').textContent=S.sc;rp();$('lg').innerHTML='';
}

// LEVEL 1: EVIDENCE LINKING
function lv1(){S.lv=1;S.ei=0;S.el=0;r1()}
function r1(){
 A.innerHTML='';
 $('lt').textContent='Level 1: Evidence Linking '+(S.ei+1)+'/'+D.e.length;rp();
 if(S.ei>=D.e.length){lvlDone(1,'All '+D.e.length+' memories linked! Each confidence boosted by NAL truth revision.');return}
 const it=D.e[S.ei];
 st('Link the correct episode to this memory to boost its confidence (c='+it.c.toFixed(2)+' &rarr; '+it.tc.toFixed(2)+')','i');
 const c=document.createElement('div');c.className='mc';
 c.innerHTML='<div class="ml">'+it.l+'</div><div class="md">'+it.d+'</div>'+
 '<div class="sv"><div class="si"><span class="l">f=</span><span class="v f1">'+it.f.toFixed(2)+'</span></div>'+
 '<div class="si"><span class="l">c=</span><span class="v f2">'+it.c.toFixed(2)+'</span></div>'+
 '<div class="si"><span class="l">target c=</span><span class="v f3">'+it.tc.toFixed(2)+'</span></div></div>'+
 '<div class="sb" style="max-width:200px"><div class="fl" style="width:'+it.c*100+'%"></div></div>';
 A.appendChild(c);
 const p=document.createElement('div');p.style.margin='10px 0';
 p.innerHTML='<div style="font-size:.78em;color:#6c6c8e;margin-bottom:6px">Available episodes (click to link):</div>';
 D.a.forEach(ep=>{const e=document.createElement('div');e.className='ep';e.textContent=ep;
 e.onclick=()=>{if(e.classList.contains('us'))return;
  if(ep===it.ce){e.classList.add('us','ok');S.sc+=100;S.el++;$('sc').textContent=S.sc;
   st('&#10003; Evidence linked! NAL truth revision: c='+it.c.toFixed(2)+' &rarr; '+it.tc.toFixed(2)+'. +100','s');
   setTimeout(()=>{S.ei++;r1()},1400);
  }else{e.classList.add('us','no');st('&#10007; Wrong episode &mdash; that evidence does not support this memory.','e')}
 };p.appendChild(e)});A.appendChild(p);
}

// LEVEL 2: CONTRADICTION RESOLUTION
function lv2(){S.lv=2;S.cd=0;r2()}
function r2(){
 A.innerHTML=$('lt').textContent='Level 2: Contradiction Resolution';rp();
 st('Two memories conflict about how to deploy to Max_folio. Identify the CORRECT one, then CONTRADICT the outdated one.','i');
 D.c.forEach((c,i)=>{
  const cd=document.createElement('div');cd.className='cc';
  if(c.ok&&S.cd>=1)cd.classList.add('okc');
  if(!c.ok&&S.cd>=2)cd.classList.add('con');
  cd.innerHTML='<div class="cl">'+c.l+' <span class="tg '+(c.ok?'ok':'no')+'">'+c.t+'</span></div>'+
  '<div class="cd">'+c.d+'</div><div class="cs">STV: f='+c.f.toFixed(3)+', c='+c.c.toFixed(3)+'</div>';
  if((c.ok&&S.cd>=1)||(!c.ok&&S.cd>=2)){const n=document.createElement('div');n.className='cn';n.innerHTML=c.n;cd.appendChild(n)}
  cd.onclick=()=>handleCon(c,cd);A.appendChild(cd);
 });
 if(S.cd>=2){st('&#10003; Contradiction resolved! Outdated memory revised. +200','s');
  setTimeout(()=>lvlDone(2,'Contradiction resolved! The outdated deploy warning has been revised by NAL truth revision.'),1600);return}
}
function handleCon(c,el){
 if(c.ok&&S.cd===0){el.classList.add('okc');S.cd=1;S.sc+=100;$('sc').textContent=S.sc;
  st('&#10003; Correct! This is the active deployment method. +100. Now contradict the outdated one.','s');
 }else if(!c.ok&&S.cd===1){el.classList.add('con');S.cd=2;S.sc+=100;$('sc').textContent=S.sc;
  st('&#10003; Contradicted! NAL truth revision applied. STV f='+c.f.toFixed(3)+' (revised from 0.625). +100','s');
  setTimeout(r2,1400);
 }else if(c.ok&&S.cd>=1){st('Already identified as correct.','h');
 }else if(!c.ok&&S.cd===0){st('&#10007; Identify the CORRECT memory first.','e');
 }
}

// LEVEL 3: DEDUCTION CHAIN
function lv3(){S.lv=3;S.dc=[];r3()}
function r3(){
 A.innerHTML=$('lt').textContent='Level 3: Inheritance Deduction';rp();
 st('Build the inheritance chain: Omega &rarr; OmegaClaw &rarr; MeTTaClaw. Click nodes in order.','i');
 D.d.n.forEach(n=>{
  const el=document.createElement('div');el.className='dn'+(S.dc.includes(n.l)?' ic':'');
  el.innerHTML=n.l+'<div class="ds">'+n.s+'</div>';
  el.onclick=()=>handleDed(n.l,el);A.appendChild(el);
 });
 if(S.dc.length===3){
  const r=document.createElement('div');r.className='dr';
  r.innerHTML='&#10003; Deduction complete! (--> Omega MeTTaClaw)<br>Result: '+D.d.r+'<br><span style="font-size:.78em">'+D.d.n+'</span>';
  A.appendChild(r);S.sc+=200;$('sc').textContent=S.sc;
  setTimeout(()=>lvlDone(3,'Inheritance chain deduced! NAL transitive closure applied.'),2000);
 }
}
function handleDed(l,el){
 if(S.dc.includes(l)){st('Already in chain.','h');return}
 const idx=S.dc.length;
 if(D.d.ch[idx]===l){S.dc.push(l);el.classList.add('sel');
  if(S.dc.length>1){const a=document.createElement('span');a.className='da';a.innerHTML='&rarr;';A.insertBefore(a,el)}
  st('&#10003; '+l+' added to chain. ('+(idx+1)+'/3)','s');setTimeout(r3,500);
 }else{st('&#10007; Wrong order. The chain starts with Omega.','e')}
}

// LEVEL 4: CONSOLIDATION
function lv4(){S.lv=4;S.cs=0;r4()}
function r4(){
 A.innerHTML=$('lt').textContent='Level 4: Full Consolidation';rp();
 st('Final pass: apply all three NAL operations in sequence to complete the consolidation cycle.','i');
 const steps=[
  {d:'Link evidence to a memory',done:S.cs>=1},
  {d:'Contradict an outdated belief',done:S.cs>=2},
  {d:'Deduce an inheritance chain',done:S.cs>=3},
 ];
 steps.forEach((s,i)=>{
  const e=document.createElement('div');e.className='con-step'+(s.done?' done':'');
  e.innerHTML='<div class="num">'+(i+1)+'</div><div class="desc">'+s.d+(s.done?' &#10003;':'')+'</div>';
  A.appendChild(e);
 });
 if(S.cs===0){
  st('Click to link episode: 2026-10-25 10:54:23 to Kevin &rarr; games_hosted','h');
  ab('Link Episode',()=>{S.cs=1;S.sc+=100;$('sc').textContent=S.sc;st('&#10003; Evidence linked! +100','s');setTimeout(r4,800)});
 }else if(S.cs===1){
  st('Click to contradict the outdated gh-pages-only warning','h');
  ab('Contradict Outdated',()=>{S.cs=2;S.sc+=100;$('sc').textContent=S.sc;st('&#10003; Contradicted! STV revised. +100','s');setTimeout(r4,800)});
 }else if(S.cs===2){
  st('Click to deduce: Omega &rarr; OmegaClaw &rarr; MeTTaClaw','h');
  ab('Deduce Chain',()=>{S.cs=3;S.sc+=200;$('sc').textContent=S.sc;st('&#10003; Deduced! (--> Omega MeTTaClaw) +200','s');setTimeout(r4,800)});
 }else{
  setTimeout(()=>lvlDone(4,'Full consolidation cycle complete! All NAL operations applied.'),200);
 }
}

// LEVEL COMPLETE
function lvlDone(lvl,msg){
 A.innerHTML='';
 const d=document.createElement('div');d.className='lc';
 d.innerHTML='<h3>&#10003; Level '+lvl+' Complete!</h3><p>'+msg+'</p>';
 A.appendChild(d);
 if(lvl<4){ab('Next &rarr;',()=>{[null,lv2,lv3,lv4][lvl]()})}
 else{
  // Final screen
  const f=document.createElement('div');f.className='lc';f.style.marginTop='20px';
  f.innerHTML='<h2>&#x1f3c6; NAL QUEST Complete!</h2>'+
  '<p>You have performed the same NAL reasoning operations that Iter uses to maintain its persistent memory:</p>'+
  '<div class="fs"><table>'+
  '<tr><td class="l2">Evidence Linked</td><td class="v2">3 memories</td></tr>'+
  '<tr><td class="l2">Contradictions Resolved</td><td class="v2">1 outdated belief</td></tr>'+
  '<tr><td class="l2">Inheritance Deduced</td><td class="v2">Omega &rarr; MeTTaClaw</td></tr>'+
  '<tr><td class="l2">Consolidation Pass</td><td class="v2">Complete</td></tr>'+
  '<tr><td class="l2">Final Score</td><td class="v2">'+S.sc+'</td></tr>'+
  '</table></div>'+
  '<p style="margin-top:20px;font-size:.78em;color:#5c6bc0">Every node, episode, truth value, and contradiction in this game is <b>real</b> &mdash; pulled from Iter\'s actual chroma_db LTM with NAL truth revision history. No other AI harness has this.</p>';
  A.appendChild(f);
  ab('Play Again',intro);
 }
}

// INIT
intro();
</script>
</body>
</html>
